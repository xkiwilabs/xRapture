name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Linux needs PortAudio for sounddevice; macOS/Windows bundle it in the wheel.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      # The core/audio stack must import on every OS — this is the breakage most
      # likely to differ across platforms (audio capture, ffmpeg, ctranslate2).
      - name: Core import smoke
        run: >-
          python -c "import sounddevice, av, numpy, PIL, plyer, faster_whisper;
          import xrapture.audio_engine, xrapture.transcriber, xrapture.settings, xrapture.paths;
          import sys; print('core import OK on', sys.platform)"

      # tkinter + pystray need a desktop GUI stack that headless Linux runners
      # lack (and setup-python doesn't bundle tkinter on Linux). They're exercised
      # on macOS and Windows, which is representative of a real desktop.
      - name: GUI import smoke (macOS + Windows)
        if: runner.os != 'Linux'
        run: >-
          python -c "import tkinter, pystray;
          import xrapture.app, xrapture.widget, xrapture.progress, xrapture.filepicker;
          print('gui import OK')"

      - name: Unit tests
        run: python -m pytest -q
