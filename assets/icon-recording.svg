<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- xRapture tray icon: microphone + waveform (active / recording) -->
  <!-- mic capsule -->
  <rect x="26" y="10" width="12" height="26" rx="6" fill="#e23b2e"/>
  <!-- mic cradle -->
  <path d="M20 30 a12 12 0 0 0 24 0" fill="none" stroke="#e23b2e" stroke-width="3" stroke-linecap="round"/>
  <!-- stand -->
  <line x1="32" y1="42" x2="32" y2="50" stroke="#e23b2e" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="52" x2="40" y2="52" stroke="#e23b2e" stroke-width="3" stroke-linecap="round"/>
  <!-- taller waveform to read as "live" -->
  <g stroke="#e23b2e" stroke-width="2.5" stroke-linecap="round">
    <line x1="10" y1="18" x2="10" y2="30"/>
    <line x1="15" y1="12" x2="15" y2="36"/>
    <line x1="49" y1="12" x2="49" y2="36"/>
    <line x1="54" y1="18" x2="54" y2="30"/>
  </g>
</svg>
